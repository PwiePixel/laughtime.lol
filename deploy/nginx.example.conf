# LaughTime.lol behind Nginx – example for servers that do not use the
# Cloudflare Tunnel (bash install.sh --no-tunnel).
#
# Replace NODE_IP:PORT with the address of the LaughTime instance
# (127.0.0.1:3000 on the same machine) and add your certificates.
# WebSockets (/ws) need the Upgrade headers, otherwise the game is stuck at
# "Connecting…". Main page and beta run on the same instance: the app tells
# them apart by the Host header, so pass it on unchanged.

server {
    listen 443 ssl http2;
    server_name laughtime.lol www.laughtime.lol beta.laughtime.lol;
    # ssl_certificate …; ssl_certificate_key …;

    # own uploads up to 8 MB (UPLOAD_MAX_MB) – Nginx allows only 1 MB by default
    # and would answer "413 Request Entity Too Large"
    client_max_body_size 10m;

    location / {
        proxy_pass http://NODE_IP:PORT;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# plain HTTP only redirects to HTTPS
server {
    listen 80;
    server_name laughtime.lol www.laughtime.lol beta.laughtime.lol;
    return 301 https://$host$request_uri;
}
